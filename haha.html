<!DOCTYPE html>
<html lang="id">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>AM PREM GRATIS</title>

    <style>
        /* =========================
           RESET
           ========================= */

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }


        /* =========================
           BODY
           ========================= */

        body {
            font-family: "Courier New", monospace;
            min-height: 100vh;
            overflow-x: hidden;
            color: white;

            background:
                radial-gradient(
                    circle at 20% 30%,
                    #243b80 0%,
                    transparent 20%
                ),
                radial-gradient(
                    circle at 80% 70%,
                    #541878 0%,
                    transparent 20%
                ),
                linear-gradient(
                    135deg,
                    #02010a,
                    #08051c,
                    #000
                );
        }


        /* =========================
           BINTANG
           ========================= */

        body::before {
            content: "";
            position: fixed;
            inset: 0;
            pointer-events: none;

            background-image:
                radial-gradient(
                    white 1px,
                    transparent 1px
                ),
                radial-gradient(
                    white 1px,
                    transparent 1px
                );

            background-size:
                80px 80px,
                130px 130px;

            background-position:
                0 0,
                40px 60px;

            opacity: 0.5;
        }


        /* =========================
           JUDUL & TEXT
           ========================= */

        h1 {
            text-align: center;
            margin: 30px 0 20px;

            text-shadow:
                0 0 10px #6c8cff,
                0 0 25px #6c8cff;
        }

        h2 {
            text-align: center;
            margin-bottom: 20px;
        }

        p {
            text-align: center;
            margin: 20px;
        }


        /* =========================
           GAMBAR
           ========================= */

        img {
            display: block;

            width: 150px;
            height: 150px;

            aspect-ratio: 1 / 1;

            object-fit: cover;

            margin: 25px auto;

            border-radius: 20px;

            box-shadow:
                0 0 10px #557cff,
                0 0 30px #557cff;
        }


        /* =========================
           BUTTON
           ========================= */

        button {
            display: block;

            width: 120px;
            height: 40px;

            margin: 20px auto;

            color: white;

            font-family: "Courier New", monospace;

            background:
                linear-gradient(
                    #000000,
                    #000000
                ) padding-box,

                linear-gradient(
                    90deg,
                    #0066ff,
                    #8000ff
                ) border-box;

            border: 3px solid transparent;

            border-radius: 20px;

            box-shadow:
                0 0 5px #00aaff,
                0 0 15px #00aaff,
                0 0 30px #00aaff;

            cursor: pointer;

            transition: 0.2s;
        }


        button:hover {
            transform: scale(1.05);
        }


        button:active {
            transform: scale(1.1);
        }


        /* =========================
           SECTION
           ========================= */

        section {
            width: 100%;

            display: flex;

            justify-content: center;

            align-items: center;

            padding: 30px 20px;
        }


        /* =========================
           KOTAK PREM
           ========================= */

        .PREM {
            width: 90%;
            max-width: 500px;

            padding: 30px;

            text-align: center;

            background:
                rgba(255, 255, 255, 0.1);

            border:
                2px solid #557cff;

            border-radius: 20px;

            backdrop-filter: blur(10px);

            box-shadow:
                0 0 10px #0066ff,
                0 0 30px #8000ff;
        }


        .PREM h2 {
            color: white;

            text-shadow:
                0 0 10px #557cff;
        }


        /* =========================
           JARAK ANTAR ELEMEN
           ========================= */

        body > p {
            margin-top: 15px;
            margin-bottom: 15px;
        }


        /* =========================
           MOBILE
           ========================= */

        @media (max-width: 600px) {

            h1 {
                font-size: 28px;
            }

            img {
                width: 120px;
                height: 120px;
            }

            .PREM {
                width: 90%;
                padding: 25px;
            }
        }

    </style>
</head>


<body>

</body>
